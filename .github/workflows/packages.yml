# Publishes @etesian-design/tokens, vue, quasar and shell to GitHub Packages at the version the release workflow
# (release.yml) has just made from the commit messages; all four get that version and depend on each other at it.
# Run by hand (Actions → Packages) only to publish an existing version again.
name: Packages

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, e.g. 0.5.0 (its tag must exist)'
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v${{ inputs.version }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com
          scope: '@etesian-design'
      - run: npm ci
      - run: npm test
      - name: Set the version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs"), v = process.env.VERSION.replace(/^v/, "");
            for (const p of ["tokens", "vue", "quasar", "shell"]) {
              const f = `packages/${p}/package.json`, d = JSON.parse(fs.readFileSync(f, "utf8"));
              d.version = v;
              for (const k of Object.keys(d.dependencies ?? {})) if (k.startsWith("@etesian-design/")) d.dependencies[k] = `^${v}`;
              fs.writeFileSync(f, JSON.stringify(d, null, 2) + "\n");
            }'
      - run: npm run build
      - name: Publish (dependencies first)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: for p in tokens vue quasar shell; do (cd packages/$p && npm publish); done
