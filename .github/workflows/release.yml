# Releases with semantic-release (https://github.com/semantic-release/semantic-release), following its GitHub Actions
# recipe. On every push to main, after the commit messages and the tests pass, semantic-release reads the Conventional
# Commits since the last tag (feat = minor, fix = patch, breaking = minor while we are below 1.0, see .releaserc.json;
# docs, chore, ci, test release nothing), publishes the four packages at that version and makes the tag and the GitHub
# release. Nobody tags by hand.
name: Release

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read # for checkout

jobs:
  commits:
    name: Commit lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm install --no-audit --no-fund
        working-directory: .github/commitlint
      - name: Lint commits
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then from=$BASE; else from=$BEFORE; fi
          case "$from" in ''|0000000000000000000000000000000000000000) from="$SHA~1" ;; esac
          cd .github/commitlint && npx commitlint --config "$GITHUB_WORKSPACE/.github/commitlint/commitlint.config.js" --cwd "$GITHUB_WORKSPACE" --from "$from" --to "$SHA" --verbose

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - run: npm clean-install
      - run: npm test

  release:
    name: Release
    needs: [commits, test]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create GitHub releases
      issues: write # comment on released issues
      pull-requests: write # comment on released pull requests
      id-token: write # OIDC for npm provenance
      packages: write # publish to GitHub Packages
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Install dependencies
        run: npm clean-install
      - name: Verify signatures
        run: npm audit signatures
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # GitHub Packages, read by .npmrc
        run: npx semantic-release
